  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="450" y="20" text-anchor="middle" class="title">claude — tiltrank</text>

  <text x="20" y="62" class="user" xml:space="preserve">&gt; Which cache should the API use? Redis, an in-memory LRU, file-based,</text>
  <text x="20" y="82" class="user" xml:space="preserve">  or a managed SaaS. It has to be self-hosted.</text>

  <text x="20" y="118" xml:space="preserve"><tspan class="tool">●</tspan> Bash(python3 scripts/rubric.py)</text>
  <text x="20" y="138" class="dim" xml:space="preserve">  └  1. Redis          score 81  (evidence 90)</text>
  <text x="20" y="158" class="dim" xml:space="preserve">     2. File-based     score 49  (evidence 60)</text>
  <text x="20" y="178" class="dim" xml:space="preserve">     3. In-memory LRU  score 41  (evidence 60)</text>
  <text x="20" y="198" xml:space="preserve">     <tspan class="bad">--. Managed SaaS  EXCLUDED — violates the self-hosted requirement</tspan></text>
  <text x="20" y="218" xml:space="preserve">     <tspan class="dim">band:</tspan> <tspan class="ok">Separated — a recommendation is defensible</tspan></text>

  <rect x="20" y="240" width="860" height="236" rx="6" fill="none" stroke="#4a4a4a"/>
  <text x="40" y="268" class="q" xml:space="preserve">Which caching approach?</text>
  <text x="40" y="292" class="dim" xml:space="preserve">Runner-up case: file-based needs no new service at all, which matters more</text>
  <text x="40" y="310" class="dim" xml:space="preserve">if this stays a single box.</text>
  <text x="40" y="328" class="dim" xml:space="preserve">Excluded: Managed SaaS (violates the self-hosted requirement).</text>

  <text x="40" y="364" xml:space="preserve"><tspan class="sel">❯ 1. Redis (Recommended)</tspan>   Strong lead — proven at this shape, one more service to run</text>
  <text x="40" y="390" xml:space="preserve">  2. File-based            <tspan class="dim">Contested — zero infra, too slow above light traffic</tspan></text>
  <text x="40" y="416" xml:space="preserve">  3. In-memory LRU         <tspan class="dim">Weak — the cache is lost on every restart</tspan></text>
  <text x="40" y="442" xml:space="preserve">  4. Other                 <tspan class="dim">type your own answer</tspan></text>

  <text x="20" y="510" xml:space="preserve"><tspan class="ok">✔</tspan> You picked <tspan class="user">Redis</tspan> <tspan class="dim">· decision recorded in .decisions.log</tspan></text>
