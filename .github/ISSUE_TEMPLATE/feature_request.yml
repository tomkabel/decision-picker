name: Feature request
description: Suggest a new behavior or improvement for decision-picker.
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What decision or workflow are you trying to support that the skill doesn't handle well today?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: What should the skill do? Be specific — new gate, new reason category, new output field, etc.
    validations:
      required: true
  - type: dropdown
    id: fixture-needed
    attributes:
      label: Does this need new fixture coverage?
      description: Per the contributing rules, new protocol behavior needs a labelled trace in fixtures.json.
      options:
        - "Yes — I'll add one"
        - "Yes — but I'd need help writing it"
        - "No — this is a non-protocol change (docs, CI, etc.)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try or consider before filing this?
