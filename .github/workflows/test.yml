name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The skill claims Python >=3.10 and ships stdlib-only. Test the floor,
        # or the claim is decoration.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: unit tests (validation, gating, ranking)
        run: python3 .claude/skills/decision-picker/scripts/test_rubric.py

      - name: protocol assertions (offline fixtures)
        run: python3 .claude/skills/decision-picker/scripts/eval/check_trace.py

      - name: no stray imports outside the stdlib
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          stdlib = sys.stdlib_module_names
          bad = []
          for f in pathlib.Path(".claude").rglob("*.py"):
              for node in ast.walk(ast.parse(f.read_text())):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  for n in names:
                      root = n.split(".")[0]
                      if root not in stdlib and root not in {"rubric", "check_trace"}:
                          bad.append(f"{f}: {n}")
          print("\n".join(bad) or "stdlib only")
          sys.exit(1 if bad else 0)
          PY

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate skill frontmatter
        run: claude plugin validate .claude/skills
